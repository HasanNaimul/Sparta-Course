[project]
name = "day2-ledger"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.ruff]
target-version = "py312"
line-length = 100
# The CA fixture repositories are generated by build.sh and are deliberately
# broken (unresolved conflict markers, a seeded regression). They are teaching
# material, not part of this project, so the gate must not walk into them.
extend-exclude = ["ca1-conflict", "ca2-bisect"]

[tool.ruff.lint]
# E/F  = pycodestyle + pyflakes (the baseline)
# I    = import sorting
# B    = flake8-bugbear: real bug patterns, not style (B006 is the mutable default)
# UP   = pyupgrade: modern syntax for the pinned Python
# SIM  = flake8-simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
